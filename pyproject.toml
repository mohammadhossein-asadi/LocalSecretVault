[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localsecretvault"
version = "0.1.0"
description = "A lightweight, local-first password and developer secrets manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "LocalSecretVault Contributors" },
]
keywords = ["secrets", "password", "vault", "encryption", "security", "cli", "developer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0",
    "typer[all]>=0.9.0",
    "rich>=13.0",
    "textual>=0.40",
    "platformdirs>=3.0",
    "pyperclip>=1.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
localsecretvault = "localsecretvault.cli.app:main"

[project.urls]
Homepage = "https://github.com/localsecretvault/localsecretvault"
Repository = "https://github.com/localsecretvault/localsecretvault"
Issues = "https://github.com/localsecretvault/localsecretvault/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",  # allow assert in tests
    "S105",  # allow hardcoded passwords in test fixtures
    "S106",  # allow hardcoded passwords in test fixtures
    "S107",  # allow default parameter values that look like passwords
    "S110",  # allow try-except-pass in cleanup/best-effort code
    "S603",  # subprocess calls with list args are safe here
    "S607",  # subprocess with partial path is intentional for gh CLI
    "SIM105",# contextlib.suppress is not always clearer
    "B904",  # raise without from in CLI error handling (intentional)
    "B017",  # broad exception in security tests (intentional)
    "E741",  # ambiguous variable name in test comprehensions
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyperclip.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "security: marks security tests",
]
